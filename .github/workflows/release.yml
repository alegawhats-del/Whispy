name: Release

on:
  push:
    branches: ["main"]
    paths-ignore: ["version.json", "README.md", "RELEASE.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Read version, skip if already released
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python get_version.py
          "ver=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          gh release view "v$v" --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -eq 0) { "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append; "Release v$v уже есть — пропускаю" }
          else { "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append }

      - name: Default API key (from secret)
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          KEY: ${{ secrets.DEFAULT_API_KEY }}
        run: |
          if ($env:KEY) { Set-Content -Path default_key.txt -Value $env:KEY -NoNewline; "key: embedded" } else { "key: none" }

      - name: Icon
        if: steps.ver.outputs.exists == 'false'
        run: python make_icon.py

      - name: Build exe (PyInstaller)
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path default_key.txt) { $extra += @("--add-data", "default_key.txt;.") }
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name Whispy --icon whispy.ico --add-data "whispy.ico;." @extra `
            --collect-all customtkinter --collect-all yt_dlp --collect-all faster_whisper `
            --collect-all ctranslate2 --collect-all av --collect-all tokenizers `
            --collect-all huggingface_hub --collect-all onnxruntime `
            --hidden-import PIL._tkinter_finder app.py
          if (-not (Test-Path dist/Whispy/Whispy.exe)) { Write-Error "exe not built"; exit 1 }

      - name: Inno Setup
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          Set-Content -Path installed.flag -Value "installed"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q /DAppVersion=${{ steps.ver.outputs.ver }} installer.iss
          Get-ChildItem installer_out

      - name: Release notes
        if: steps.ver.outputs.exists == 'false'
        id: notes
        shell: pwsh
        run: |
          $body = Get-Content NOTES.md -Raw
          "body<<EOF`n$body`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: Whispy ${{ steps.ver.outputs.ver }}
          body: ${{ steps.notes.outputs.body }}
          files: installer_out/Whispy-Setup-${{ steps.ver.outputs.ver }}.exe

      - name: Update version.json on main
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          python bump_manifest.py ${{ steps.ver.outputs.ver }}
          git add version.json
          git commit -m "version.json -> ${{ steps.ver.outputs.ver }} [skip ci]"
          git push origin main
